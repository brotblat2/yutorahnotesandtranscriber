name: ShiurNotes

options:
  bundleIdPrefix: com.brotblat2
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic

schemes:
  ShiurNotes:
    build:
      targets:
        ShiurNotes: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  ShiurNotes:
    type: application
    platform: iOS
    sources:
      - path: ShiurNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brotblat2.ShiurNotes
        PRODUCT_NAME: Shiur Notes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shiur Notes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
