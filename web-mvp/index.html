<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shiur Notes">
  <meta name="description" content="Turn Torah audio into structured notes and transcripts.">
  <title>Shiur Notes</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./extension-theme.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="nav-button hidden" id="backButton" aria-label="Go back">Back</button>
      <div class="brand-lockup">
        <span class="brand-mark">ש</span>
        <div><p>SHIUR NOTES</p><h1 id="screenTitle">Home</h1></div>
      </div>
      <button class="nav-button" id="topAction">Add</button>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav class="tabbar" id="tabbar" aria-label="Primary navigation">
      <button class="tab active" data-tab="home"><span>Home</span></button>
      <button class="tab" data-tab="library"><span>Library</span></button>
      <button class="tab" data-tab="settings"><span>Settings</span></button>
    </nav>
  </div>

  <dialog id="addDialog" class="sheet">
    <form method="dialog" class="sheet-card" id="addForm">
      <div class="sheet-head">
        <div><p class="kicker">NEW SHIUR</p><h2>Choose a source</h2></div>
        <button class="close-button" value="cancel" aria-label="Close">Close</button>
      </div>
      <label class="field-label" for="shiurUrl">YUTorah, Kol Halashon, or direct audio URL</label>
      <input id="shiurUrl" class="text-input" type="url" inputmode="url" autocomplete="url" placeholder="Paste a link">
      <button type="button" class="primary-button" id="continueLink">Continue with link</button>
      <div class="divider"><span>or</span></div>
      <button type="button" class="choice-button" id="importAudio">
        <span><strong>Import an audio file</strong><small>MP3, M4A, WAV, or another supported format</small></span>
      </button>
      <input id="audioFile" type="file" accept="audio/*" hidden>
      <button type="button" class="choice-button" id="pasteClipboard">
        <span><strong>Paste from clipboard</strong><small>Use the link currently copied on your device</small></span>
      </button>
    </form>
  </dialog>

  <dialog id="keyDialog" class="sheet">
    <form method="dialog" class="sheet-card" id="keyForm">
      <div class="sheet-head">
        <div><p class="kicker">GEMINI</p><h2>Personal API key</h2></div>
        <button class="close-button" value="cancel">Close</button>
      </div>
      <p class="notice">Your key is stored only in this browser. On the production site it is sent to the server for the current generation request and is not saved there.</p>
      <label class="field-label" for="apiKeyInput">Gemini API key</label>
      <input id="apiKeyInput" class="text-input" type="password" autocomplete="off" placeholder="AIza…">
      <button type="button" class="primary-button" id="saveApiKey">Save key</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="./app.js" defer></script>
  <script src="./state-bridge.js" defer></script>
  <script src="./link-resolver.js" defer></script>
  <script src="./production-api.js" defer></script>
  <script src="./yutorah-search.js?v=1" defer></script>
  <script src="./export-tools.js" defer></script>
  <script src="./pdf-export-v18.js?v=18" defer></script>
</body>
</html>
