name: Web MVP Pages

on:
  push:
    branches: [app]
    paths:
      - "web-mvp/**"
      - ".github/workflows/web-mvp-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out app branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web MVP
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-mvp

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Deployment retrigger after allowing the app branch.
