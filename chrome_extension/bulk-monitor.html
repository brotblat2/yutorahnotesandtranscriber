<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing queue - Shiur AI Assistant</title>
    <link rel="stylesheet" href="bulk-monitor.css">
    <link rel="stylesheet" href="design-system.css">
</head>
<body data-page="queue">
    <main class="monitor-shell">
        <header class="monitor-header">
            <div>
                <p class="monitor-kicker">KEEP THE LEARNING GOING</p>
                <h1>Processing queue</h1>
                <p class="monitor-subtitle">Your shiurim are becoming notes. Follow their progress here.</p>
            </div>
            <button id="refresh" class="monitor-button" type="button">Refresh</button>
        </header>
        <div id="summary" class="monitor-summary">Loading queues...</div>
        <section id="jobs" class="job-grid" aria-live="polite"></section>
    </main>
    <script src="bulk-monitor.js"></script>
    <script src="app-shell.js"></script>
</body>
</html>
